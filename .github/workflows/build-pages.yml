# Rebuilds the search-friendly listing pages, sitemap.xml and robots.txt
# whenever listing data changes (for example after you edit in Pages CMS).
name: Build listing pages
on:
  push:
    branches: [main]
    paths:
      - "data/listings.json"
      - "data/ddf-listings.json"
      - "scripts/build-pages.mjs"
      - "index.html"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-pages.mjs
      - name: Save changes
        run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add listing ko sitemap.xml robots.txt
          git diff --staged --quiet || git commit -m "Rebuild listing pages"
          git push
