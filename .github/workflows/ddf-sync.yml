# Updates MLS® listings from REALTOR.ca DDF® twice a day (free on GitHub).
name: DDF listing sync
on:
  schedule:
    - cron: "17 12,0 * * *"   # about 6 AM and 6 PM Calgary time
  workflow_dispatch:           # "Run workflow" button for a manual update
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download DDF listings
        env:
          DDF_USERNAME: ${{ secrets.DDF_USERNAME }}
          DDF_PASSWORD: ${{ secrets.DDF_PASSWORD }}
        run: node scripts/ddf-sync.mjs
      - name: Rebuild listing pages
        run: node scripts/build-pages.mjs
      - name: Save changes
        run: |
          git config user.name "ddf-bot"
          git config user.email "ddf-bot@users.noreply.github.com"
          git add data/ddf-listings.json listing sitemap.xml robots.txt
          git diff --staged --quiet || git commit -m "Update DDF listings"
          git push
